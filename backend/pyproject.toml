[project]
name = "backend"
version = "0.1.0"
description = "Basic FastAPI HTTP server"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "pinecone>=6.0.0",
    "openai>=3.6.0",
    "anthropic>=1.2.0",
    "sse-starlette>=3.4.8",
    "boto3>=1.35",
    "tiktoken>=0.7",
    "python-multipart>=0.0.9",
    "redis>=5.0",
]

# Test-only, so a deployment does not carry a test runner.
[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
# Every test that touches the pipeline is async, so declaring the mode once
# here beats decorating each one.
asyncio_mode = "auto"
testpaths = ["tests"]
# Quiet by default: a smoke suite is read when it fails, not when it passes.
addopts = "-q"
markers = [
    "live: hits the real Pinecone, OpenAI and R2. Skipped unless --live is passed.",
]
